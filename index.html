 $('balance').textContent=`Баланс: ${state.balance.toLocaleString('ru-RU')}`;
 $('dogName').textContent=state.dogName;$('hungerValue').textContent=`${state.hunger}/100`;$('joyValue').textContent=`${state.joy}/100`;
 $('hungerBar').style.width=state.hunger+'%';$('joyBar').style.width=state.joy+'%';$('levelValue').textContent=state.level;$('progressValue').textContent=`Очки радости: ${state.totalJoy}`;
}
function row(title,sub,buttons){return `<div class="item-row"><div><div class="item-title">${title}</div><div class="item-sub">${sub}</div></div><div class="item-actions">${buttons}</div></div>`}
function btn(label,action,disabled=false,cls='small-button'){return `<button class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function panel(html){$('panel').innerHTML=html;}
function renderPanel(){
 const p=$('panel');
 if(activeTab==='home'){panel(`<h2>Мой двор</h2><p>Заботься о таксе: корми её, играй и отправляй на работу.</p><button class="primary" data-action="play">Поиграть · +50 радости</button><div class="action-row">${btn('Переименовать · 500 жетонов','rename-open',state.balance<500,'action')}${btn('Мой прогресс','progress',false,'action')}</div><p class="item-sub">Прогресс хранится на этом устройстве в браузере.</p>`);return;}
 if(activeTab==='food'){let h='<h2>Магазин еды</h2><p>Купи еду, затем используй её из инвентаря.</p>';for(const [k,v] of Object.entries(state.foods))h+=row(v.name,`+${v.hunger} голода · ${v.price} жетонов`,btn('Купить','buy:'+k,state.balance<v.price));h+='<h2>Инвентарь</h2>';let any=false;for(const [k,v] of Object.entries(state.foods))if(state.inventory[k]){any=true;h+=row(v.name,`В наличии: ${state.inventory[k]}`,btn('Использовать','feed:'+k,state.hunger+v.hunger>100));}panel(h+(any?'':'<p>Инвентарь еды пуст.</p>'));return;}
 if(activeTab==='gifts'){let h='<h2>Подарки</h2><p>Покупай подарки, чтобы повышать радость.</p>';for(const [k,v] of Object.entries(state.gifts))h+=row(v.name,`+${v.joy} радости · ${v.price} жетонов`,btn('Купить','buy:'+k,state.balance<v.price));h+='<h2>Инвентарь</h2>';let any=false;for(const [k,v] of Object.entries(state.gifts))if(state.inventory[k]){any=true;h+=row(v.name,`В наличии: ${state.inventory[k]}`,btn('Использовать','gift:'+k));}panel(h+(any?'':'<p>Подарков пока нет.</p>'));return;}
 if(activeTab==='work'){if(state.working){const w=state.working;let hrs=Math.floor((Date.now()-w.started)/3600000);panel(`<h2>Такса на работе</h2><div class="notice">Профессия: ${esc(w.name)}<br>Полных часов: ${hrs}</div><p>Зарплата начисляется за полные часы. Минимальная смена — час.</p>${btn(hrs?`Забрать зарплату: ${hrs*w.salary} жетонов`:'Забрать можно через час','work-claim',hrs<1,'primary')}`);return;}
 let h='<h2>Работа</h2><p>Нужны голод и радость не ниже 15. Смена длится минимум час.</p>';for(const [k,v] of Object.entries(state.jobs))h+=row(v.name,`Уровни ${v.min}–${v.max} · ${v.salary} жетонов/час`,btn('Устроиться','work:'+k,state.level<v.min||state.level>v.max||state.hunger<15||state.joy<15||Date.now()<state.cooldownUntil));panel(h);return;}
 if(activeTab==='more'){panel(`<h2>Ещё</h2><div class="notice">Это автономная версия без сервера.</div><p>Переводы между игроками, рейтинги всех игроков и реальные платежи отключены: для них нужна общая онлайн-база и сервер.</p><div class="action-row">${btn('Переименовать · 500','rename-open',state.balance<500,'action')}${btn('Сбросить прогресс','reset',false,'action')}</div>`);}
}
function render(){renderStats();renderPanel();save();}
function addJoy(n){state.joy=Math.min(100,state.joy+n);state.totalJoy+=n;while(state.level<101&&state.totalJoy>=500+state.level*150){state.level++;state.balance+=200+(state.level-1)*150;toast(`Новый уровень ${state.level}! Награда получена.`);}}
function act(a){
 if(a==='play'){if(state.working){toast('Такса сейчас на работе.');return;}addJoy(50);toast('Такса счастлива! +50 очков радости');}
 else if(a.startsWith('buy:')){let k=a.slice(4),v=state.foods[k]||state.gifts[k];if(!v||state.balance<v.price){toast('Недостаточно жетонов.');return;}state.balance-=v.price;state.inventory[k]=(state.inventory[k]||0)+1;toast('Покупка добавлена в инвентарь.');}
 else if(a.startsWith('feed:')){let k=a.slice(5),v=state.foods[k];if(!v||!state.inventory[k]||state.hunger+v.hunger>100){toast('Нельзя использовать эту еду сейчас.');return;}state.inventory[k]--;state.hunger+=v.hunger;toast('Такса поела.');}
 else if(a.startsWith('gift:')){if(state.working){toast('На работе нельзя использовать подарки.');return;}let k=a.slice(5),v=state.gifts[k];if(!v||!state.inventory[k])return;state.inventory[k]--;addJoy(v.joy);toast('Такса рада подарку!');}
 else if(a.startsWith('work:')){let v=state.jobs[a.slice(5)];if(!v||state.level<v.min||state.level>v.max||state.hunger<15||state.joy<15||Date.now()<state.cooldownUntil){toast('Сейчас нельзя устроиться на работу.');return;}state.working={name:v.name,salary:v.salary,started:Date.now()};toast('Смена началась!');}
 else if(a==='work-claim'){if(!state.working)return;let hrs=Math.floor((Date.now()-state.working.started)/3600000);let earned=hrs*state.working.salary;if(!hrs){toast('Сначала нужно отработать полный час.');return;}state.balance+=earned;state.working=null;state.cooldownUntil=Date.now()+15*60000;toast(`Получено ${earned} жетонов.`);}
 else if(a==='rename-open'){panel(`<h2>Переименовать таксу</h2><p>Стоимость — 500 жетонов.</p><input class="field" id="renameInput" maxlength="24" placeholder="Имя таксы"><button class="primary" data-action="rename-submit">Сохранить</button>`);return;}
 else if(a==='rename-submit'){let n=$('renameInput').value.trim();if(!n){toast('Введи имя.');return;}if(state.balance<500){toast('Недостаточно жетонов.');return;}state.balance-=500;state.dogName=n;toast('Имя изменено.');}
 else if(a==='progress'){panel(`<h2>Мой прогресс</h2><p>Уровень: ${state.level}</p><p>Очки радости: ${state.totalJoy}</p><p>Жетоны: ${state.balance}</p><p>Имя таксы: ${esc(state.dogName)}</p>`);return;}
 else if(a==='reset'){if(confirm('Сбросить весь прогресс на этом устройстве?')){state=defaults();toast('Прогресс сброшен.');}}
 render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){activeTab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));renderPanel();return;}const b=e.target.closest('[data-action]');if(b)act(b.dataset.action);});
$('dog').addEventListener('click',()=>{activeTab='home';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='home'));toast(`${state.dogName} машет хвостом!`);renderPanel();});
function offlineDecay(){let now=Date.now(),mins=Math.floor((now-(state.lastTick||now))/600000);if(mins>0){state.hunger=Math.max(0,state.hunger-mins);state.joy=Math.max(0,state.joy-mins);state.lastTick=now;save();}}
offlineDecay();render();setInterval(()=>{if(state.working&&activeTab==='work')renderPanel();},30000);

</script></body></html>
